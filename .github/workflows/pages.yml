name: Publish Visionoir
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg clang
      - run: python3 assemble.py
      - run: python3 scripts/synthesize-soundtrack.py && python3 scripts/synthesize-modes.py
      - run: cp public/assets/* _site/assets/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
