name: Publish Visionoir
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/audio-premium-requirements.txt imageio-ffmpeg
      - name: Prepare portable FFmpeg
        run: |
          mkdir -p .bin
          python -c "import imageio_ffmpeg,os,pathlib; os.symlink(imageio_ffmpeg.get_ffmpeg_exe(), '.bin/ffmpeg'); open(os.environ['GITHUB_PATH'],'a').write(str(pathlib.Path('.bin').resolve())+'\n')"
          command -v clang
      - name: Rebuild soundtracks
        run: |
          python scripts/synthesize-soundtrack.py
          python scripts/synthesize-modes.py
          python scripts/synthesize-premium.py --track all
      - run: npm ci
      - run: node --test tests/locales.test.mjs
      - name: Build localized pages
        env:
          VISIONOIR_ALL_LOCALES: '1'
          VISIONOIR_ALL_TRACKS: '1'
        run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
