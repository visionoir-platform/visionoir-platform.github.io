name: Check Unseen Protocol
on: [pull_request]
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install Pillow -r scripts/audio-premium-requirements.txt imageio-ffmpeg
      - name: Rebuild studio audio used by the website
        run: |
          mkdir -p .bin
          python -c "import imageio_ffmpeg,os; os.symlink(imageio_ffmpeg.get_ffmpeg_exe(), '.bin/ffmpeg')"
          export PATH="$PWD/.bin:$PATH"
          python scripts/synthesize-soundtrack.py
          python scripts/synthesize-modes.py
          python scripts/synthesize-premium.py --track all
          python scripts/analyze-studio-audio.py
      - run: python game/art/check.py
      - name: Ensure decoded audio can be inspected
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
      - run: node --test tests/*.test.mjs src/creator/tools/*.test.mjs frequency/audio/qa/*.test.mjs frequency/qa/*.test.mjs frequency/chromatic/qa/*.test.mjs game/engine/engine.test.mjs game/qa/checkpoint.test.mjs
      - run: npm run build
        env:
          VISIONOIR_ALL_TRACKS: '1'
          VISIONOIR_ALL_LOCALES: '1'
      - run: node game/qa/release.mjs
      - run: node scripts/check-frequency-release.mjs
      - name: Install WebKit for the mobile sensor regression
        run: ./node_modules/.bin/playwright-core install --with-deps webkit
      - name: Play, edit, meter and reopen a project in Chrome
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory dist >"${RUNNER_TEMP}/studio-http.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --retry 8 --retry-connrefused --retry-delay 1 -fsS -o /dev/null http://127.0.0.1:4173/frequency/
          FREQUENCY_BROWSER_EXEC="$(command -v google-chrome)" node frequency/qa/guided-composition.cjs http://127.0.0.1:4173
          PLAYWRIGHT_MODULE=playwright-core BROWSER_BIN="$(command -v google-chrome)" CHROMATIC_ORIGIN=http://127.0.0.1:4173 node frequency/chromatic/qa/playing-notes.cjs
          FREQUENCY_BROWSER_EXEC="$(command -v google-chrome)" node frequency/qa/accessible-sequencer.cjs http://127.0.0.1:4173
          FREQUENCY_BROWSER_EXEC="$(command -v google-chrome)" node frequency/qa/native-transport.cjs http://127.0.0.1:4173
          FREQUENCY_BROWSER_EXEC="$(command -v google-chrome)" node frequency/qa/global-transport.cjs http://127.0.0.1:4173
          FREQUENCY_BROWSER_EXEC="$(command -v google-chrome)" node frequency/qa/midi-live-fx.cjs http://127.0.0.1:4173
          MOTION_PROOF="$RUNNER_TEMP/ios-shake-webkit.json" node src/qa/ios-shake.cjs http://127.0.0.1:4173
          MOTION_BROWSER_ENGINE=chromium MOTION_BROWSER_BIN="$(command -v google-chrome)" MOTION_PROOF="$RUNNER_TEMP/ios-shake-chromium.json" node src/qa/ios-shake.cjs http://127.0.0.1:4173
          QA_ENGINE=Chromium PLAYWRIGHT_MODULE=playwright-core CHROME_PATH="$(command -v google-chrome)" VISIONOIR_QA_URL=http://127.0.0.1:4173 node scripts/qa-ecosystem.cjs
          BROWSER_BIN="$(command -v google-chrome)" CREATOR_PROOF="$RUNNER_TEMP/creator-acid" node src/creator/tools/qa-material-phases.cjs --acid
      - name: Save the two rendered portrait states for visual review
        uses: actions/upload-artifact@v4
        with:
          name: creator-stage-render
          path: |
            ${{ runner.temp }}/creator-acid/desktop-acid-rest.png
            ${{ runner.temp }}/creator-acid/desktop-acid-audio.png
            ${{ runner.temp }}/creator-acid/material-phases.json
          retention-days: 2
          if-no-files-found: error
      - name: Repair the studio and reopen a saved project offline
        run: FREQUENCY_BROWSER_EXEC="$(command -v google-chrome)" node frequency/qa/offline-repair.cjs dist
      - name: Wait for a live performance before activating the next offline build
        run: FREQUENCY_BROWSER_EXEC="$(command -v google-chrome)" node frequency/qa/offline-update.cjs dist
